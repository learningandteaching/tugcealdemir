<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="CoHALE Lab banner — Collaborative Human-AI Learning Ecologies for STEM+C">
  <defs>
    
    <linearGradient id="cohaleArc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ED8B5E"></stop>
      <stop offset="0.55" stop-color="#4F9C8B"></stop>
      <stop offset="1" stop-color="#15726B"></stop>
    </linearGradient>
    
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ED8B5E"></stop>
      <stop offset="0.5" stop-color="#4F9C8B"></stop>
      <stop offset="1" stop-color="#15726B"></stop>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F4"></stop>
      <stop offset="1" stop-color="#F4F1EA"></stop>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="500"></rect></clipPath>
  </defs>

  
  <rect x="0" y="0" width="1600" height="500" fill="url(#paper)"></rect>

  
  <g clip-path="url(#frame)" opacity="1">
    <circle cx="1360" cy="250" r="210" fill="none" stroke="#15726B" stroke-opacity="0.07" stroke-width="26" stroke-linecap="round" stroke-dasharray="916.3 403.2" stroke-dashoffset="201.6"></circle>
    <circle cx="1360" cy="250" r="150" fill="none" stroke="#4F9C8B" stroke-opacity="0.06" stroke-width="20" stroke-linecap="round" stroke-dasharray="654.5 288.0" stroke-dashoffset="144.0"></circle>
    <circle cx="1524" cy="250" r="9" fill="#ED8B5E" fill-opacity="0.14"></circle>
  </g>

  
  <g transform="translate(120,132) scale(1.0)">
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#cohaleArc)" stroke-width="7.5" stroke-linecap="round" stroke-dasharray="270.53 119.03" stroke-dashoffset="59.51"></circle>
    <circle cx="137" cy="100" r="6.5" fill="#ED8B5E"></circle>
    <circle cx="148" cy="100" r="6.5" fill="#15726B" fill-opacity="0.92"></circle>
  </g>

  
  <text class="t" x="362" y="244" font-size="96" font-weight="500" letter-spacing="1">
    <tspan fill="#15726B">Co</tspan><tspan fill="#223039">HALE</tspan><tspan dx="16" font-size="42" font-weight="400" fill="#55636B">Lab</tspan>
  </text>

  
  <text class="t" x="366" y="290" font-size="22" font-weight="300" letter-spacing="4" fill="#55636B">COLLABORATIVE HUMAN-AI LEARNING ECOLOGIES FOR STEM+C</text>

  
  
  <g class="t" font-size="17" font-weight="500" letter-spacing="0.3" fill="#33424B">
    <text x="452" y="378" text-anchor="middle">STEM+C Learning</text>
    <text x="760" y="378" text-anchor="middle">Computational Literacies &amp; Participation</text>
    <text x="1110" y="378" text-anchor="middle">AI Literacy</text>
  </g>

  
  <line x1="452" y1="398" x2="1110" y2="398" stroke="url(#thread)" stroke-width="2.5" stroke-linecap="round"></line>
  <circle cx="452" cy="398" r="6" fill="#ED8B5E"></circle>
  <circle cx="760" cy="398" r="6" fill="#4F9C8B"></circle>
  <circle cx="1110" cy="398" r="6" fill="#15726B"></circle>

  
  <text class="t" x="781" y="426" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="3.5" fill="#15726B">C O L L A B O R A T I O N</text>
</svg>